<!DOCTYPE html>
<html lang="zh-CN" style="background-color: #c8cfc9;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
    <title>上传文件</title>
    <link rel="stylesheet" href="/vendor/inter/inter.css">
    <script src="/vendor/tailwind.js"></script>
    <link rel="stylesheet" href="/vendor/phosphor/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        morandi: {
                            text: '#5B5F5D',
                            subtext: '#8A8F8D',
                            userBg: 'rgba(164, 180, 169, 0.75)',
                            aiBg: 'rgba(255, 255, 255, 0.55)',
                            accent: '#A4B4A9'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }
        body {
            height: 100vh; height: 100dvh;
            font-family: 'Inter', sans-serif;
            color: #5B5F5D;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
            background-color: #c8cfc9;
            overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.06);
        }
        .spring-btn {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            will-change: transform;
        }
        .spring-btn:active { transform: scale(0.92); }
        .safe-pt { padding-top: max(8px, env(safe-area-inset-top)); }
        .safe-pb { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
        .safe-px { padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }

        .drop-zone {
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
            min-height: 160px;
        }
        .drop-zone.dragover {
            background: rgba(255, 255, 255, 0.55);
            border-color: rgba(164, 180, 169, 0.8);
            transform: scale(1.01);
        }
        .file-item {
            transition: background-color 0.2s ease, transform 0.2s ease;
            border-radius: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .file-item:hover { background: rgba(255, 255, 255, 0.45); }
        .file-item .remove-btn {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; color: #8A8F8D;
            transition: all 0.2s ease;
        }
        .file-item .remove-btn:hover { background: rgba(255,255,255,0.7); color: #5B5F5D; }
        .file-item .remove-btn:active { transform: scale(0.75); }

        .code-box {
            width: 44px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 600;
            font-family: 'Inter', monospace;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            transition: all 0.3s ease;
            color: #5B5F5D;
        }
        .code-box.empty { border-style: dashed; border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.12); }
        .code-box.filled { border-style: solid; border-color: rgba(164,180,169,0.6); background: rgba(255,255,255,0.5); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

        .progress-bar {
            width: 100%; height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .progress-bar .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #A4B4A9, #8F9F94);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .btn-state { transition: all 0.3s ease; }
        .btn-state.state-idle { background: rgba(255,255,255,0.3); color: #8A8F8D; cursor: default; border-color: rgba(255,255,255,0.3); }
        .btn-state.state-uploading { background: rgba(164,180,169,0.5); color: #5B5F5D; cursor: default; border-color: rgba(164,180,169,0.3); }
        .btn-state.state-ready { background: #A4B4A9; color: #fff; cursor: pointer; border-color: rgba(255,255,255,0.3); box-shadow: 0 4px 16px rgba(164,180,169,0.35); }
        .btn-state.state-ready:active { transform: scale(0.92); }

        .expiry-pill {
            padding: 7px 16px; border-radius: 999px; font-size: 13px; line-height: 1;
            color: #8A8F8D; background: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.4); cursor: pointer;
            transition: all 0.2s ease;
        }
        .expiry-pill:hover { background: rgba(255,255,255,0.5); color: #5B5F5D; }
        .expiry-pill.active { background: #A4B4A9; color: #fff; border-color: rgba(255,255,255,0.3); }
        @media (min-width: 1024px) {
            .expiry-pill { padding: 9px 20px; font-size: 15px; }
        }
        .resume-badge {
            font-size: 10px; color: #8A8F8D; background: rgba(164,180,169,0.2);
            border: 1px solid rgba(164,180,169,0.4); border-radius: 999px; padding: 2px 8px; flex-shrink: 0;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-item { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
        .animate-delay-1 { animation-delay: 0.06s; }
        .animate-delay-2 { animation-delay: 0.12s; }
        .animate-delay-4 { animation-delay: 0.24s; }

        .file-list-scroll { max-height: 260px; overflow-y: auto; padding-right: 4px; }
        .file-list-scroll::-webkit-scrollbar { width: 4px; }
        .file-list-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.15); border-radius: 2px; }
        .file-list-scroll::-webkit-scrollbar-thumb { background: rgba(164,180,169,0.4); border-radius: 2px; }
        .file-list-scroll::-webkit-scrollbar-thumb:hover { background: rgba(164,180,169,0.6); }
        @media (max-width: 1023px) {
            .file-list-scroll { max-height: 200px; }
            .file-list-scroll::-webkit-scrollbar { display: none; }
        }
        @media (min-width: 1024px) {
            .file-item { padding: 14px 20px; border-radius: 14px; }
            .file-item .file-name { font-size: 15px; }
            .code-box { width: 52px; height: 60px; font-size: 26px; border-radius: 14px; }
            .drop-zone { min-height: 200px; padding: 24px !important; }
            .progress-bar { height: 10px; }
        }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="w-full overflow-hidden flex flex-col relative bg-cover bg-center selection:bg-[#A4B4A9]/30" style="background-image: url('/vendor/img/bg.jpg');">

    <div class="fixed inset-0 bg-[#e2e5e1]/65 backdrop-blur-[3px] z-0 pointer-events-none"></div>

    <!-- 顶栏 -->
    <header class="w-full glass-panel z-20 flex flex-col shrink-0 relative border-b border-white/30">
        <div class="w-full h-[env(safe-area-inset-top)] min-h-[8px]"></div>
        <div class="w-full h-[56px] lg:h-[64px] flex items-center safe-px relative">
            <button id="btn-back" class="w-9 h-9 lg:w-10 lg:h-10 rounded-full glass-panel flex items-center justify-center border border-white/60 shadow-sm spring-btn text-morandi-text cursor-pointer relative z-10 hover:bg-white/50 transition-colors">
                <i class="ph ph-caret-left text-[22px] lg:text-[24px] leading-none pr-0.5"></i>
            </button>
            <span class="ml-3 font-medium text-[17px] lg:text-[20px] tracking-widest text-morandi-text">上传文件</span>
            <div class="flex-1"></div>
            <span class="hidden lg:inline text-[13px] text-morandi-subtext/60 mr-2">
                <i class="ph ph-shield-check mr-1"></i>端到端加密
            </span>
        </div>
    </header>

    <main class="relative z-10 w-full flex-1 overflow-y-auto no-scrollbar flex flex-col safe-px safe-pb">
        <div class="w-full max-w-sm lg:max-w-3xl xl:max-w-4xl mx-auto flex-1 flex flex-col justify-start gap-5 lg:gap-7 py-5 lg:py-8">

            <!-- 上传区域 -->
            <div id="drop-zone" class="w-full glass-panel rounded-[24px] lg:rounded-[28px] p-4 lg:p-6 border border-white/60 shadow-sm drop-zone animate-item animate-delay-1 relative">
                <div id="drop-hint" class="flex flex-col items-center justify-center text-center py-6 lg:py-10 text-morandi-subtext/80 select-none pointer-events-none">
                    <i class="ph ph-cloud-arrow-up text-[40px] lg:text-[52px] text-[#A4B4A9] mb-3 lg:mb-4"></i>
                    <p class="text-[16px] lg:text-[19px] font-medium text-morandi-text">点击此处上传文件</p>
                    <p class="text-[13px] lg:text-[15px] mt-1.5 max-w-[260px] lg:max-w-sm">单文件不超过 500MB · 最多 10 个</p>
                    <p class="text-[13px] lg:text-[15px] mt-1 text-morandi-subtext/70">大文件自动分片上传，中断可续传</p>
                </div>

                <div id="file-list" class="flex flex-col gap-2 lg:gap-2.5">
                    <div class="flex items-center justify-between px-1 pb-2 lg:pb-3 border-b border-white/20">
                        <span id="file-count" class="text-[13px] lg:text-[15px] font-medium text-morandi-subtext">已选择 0 个文件 (最多 10 个)</span>
                        <span id="file-total" class="text-[12px] lg:text-[14px] text-morandi-subtext/60">总大小 0 B</span>
                    </div>
                    <div id="file-items" class="file-list-scroll flex flex-col gap-2 lg:gap-2.5 pr-1"></div>
                    <div class="text-[11px] lg:text-[12px] text-morandi-subtext/40 text-center mt-1 select-none pointer-events-none">
                        拖拽新文件到此处添加
                    </div>
                </div>

                <input type="file" id="file-input" class="hidden" multiple>
            </div>

            <!-- 有效期选择 -->
            <div class="flex flex-col items-center gap-2 lg:gap-3 animate-item animate-delay-2">
                <span class="text-[13px] lg:text-[15px] font-medium text-morandi-subtext tracking-wider">有效期</span>
                <div class="flex items-center gap-2 lg:gap-2.5" id="expiry-options">
                    <button type="button" class="expiry-pill" data-hours="1">1 小时</button>
                    <button type="button" class="expiry-pill" data-hours="6">6 小时</button>
                    <button type="button" class="expiry-pill active" data-hours="10">10 小时</button>
                    <button type="button" class="expiry-pill" data-hours="24">24 小时</button>
                </div>
            </div>

            <!-- 邀请码区域 -->
            <div class="flex flex-col items-center gap-3 lg:gap-4 animate-item animate-delay-2">
                <span class="text-[13px] lg:text-[15px] font-medium text-morandi-subtext tracking-wider">邀请码</span>
                <div class="flex items-center gap-2 lg:gap-3 select-none" id="invite-code-area">
                    <div class="code-box empty">_</div>
                    <div class="code-box empty">_</div>
                    <div class="code-box empty">_</div>
                    <span class="text-morandi-subtext/30 text-[20px] lg:text-[26px] font-light select-none mx-0.5"> </span>
                    <div class="code-box empty">_</div>
                    <div class="code-box empty">_</div>
                    <div class="code-box empty">_</div>
                </div>
                <button id="btn-copy" type="button" class="hidden items-center gap-1.5 rounded-full px-4 py-1.5 text-[12px] lg:text-[13px] font-medium text-morandi-text glass-panel border border-white/50 shadow-sm spring-btn cursor-pointer">
                    <i class="ph ph-copy text-[14px]"></i><span>复制邀请码</span>
                </button>
                <p id="code-hint" class="text-[12px] lg:text-[14px] text-morandi-subtext/60">选择文件后点击确认上传 · 有效期可选</p>
            </div>

            <!-- 进度条 + 底部按钮 -->
            <div class="flex flex-col gap-3 lg:gap-4 mt-1 animate-item animate-delay-4">
                <div class="flex flex-col gap-1.5 lg:gap-2" id="progress-wrap">
                    <div class="flex items-center justify-between text-[12px] lg:text-[14px] text-morandi-subtext/70">
                        <span>上传进度</span>
                        <span id="progress-text" class="font-medium">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
                    </div>
                </div>

                <button id="btn-action" class="btn-state state-idle w-full h-[52px] lg:h-[60px] rounded-[18px] lg:rounded-[20px] font-medium text-[16px] lg:text-[18px] tracking-wide border border-white/30 transition-all shadow-sm spring-btn flex items-center justify-center gap-2.5">
                    <i class="ph ph-check-circle text-[20px] lg:text-[24px]"></i>
                    <span id="btn-label">请先选择文件</span>
                </button>

                <p class="hidden lg:block text-center text-[12px] text-morandi-subtext/40 mt-1">
                    上传完成后生成邀请码，分享给他人即可下载文件
                </p>
            </div>

            <div class="h-2 lg:h-4"></div>
        </div>
    </main>

    <div id="toast" class="fixed top-20 lg:top-24 left-1/2 -translate-x-1/2 z-50 glass-panel border-white/80 px-5 lg:px-7 py-2.5 lg:py-3.5 rounded-full shadow-lg text-[14px] lg:text-[16px] font-medium text-morandi-text pointer-events-none transition-all duration-300 opacity-0 -translate-y-4"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const MAX_FILES = 10;
            const MAX_SIZE = 500 * 1024 * 1024; // 500MB
            const LS_KEY = 'filesync-uploads';

            const btnBack = document.getElementById('btn-back');
            const btnAction = document.getElementById('btn-action');
            const btnLabel = document.getElementById('btn-label');
            const toastEl = document.getElementById('toast');
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const fileList = document.getElementById('file-list');
            const fileItems = document.getElementById('file-items');
            const dropHint = document.getElementById('drop-hint');
            const fileCount = document.getElementById('file-count');
            const fileTotal = document.getElementById('file-total');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            const progressWrap = document.getElementById('progress-wrap');
            const inviteArea = document.getElementById('invite-code-area');
            const codeHint = document.getElementById('code-hint');
            const btnCopy = document.getElementById('btn-copy');
            const expiryOptions = document.getElementById('expiry-options');

            // 当前选中的文件列表 [{file, uploadId}]；uploadId 存在表示已有断点会话
            let selectedFiles = [];
            let selectedExpiry = 10;
            let uploading = false;
            let lastCode = ''; // 最近一次生成的邀请码，供一键复制

            // ---------- 断点会话持久化 (localStorage) ----------
            function loadStore() {
                try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
            }
            function saveStore(store) {
                try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
            }
            function saveSession(uploadId, file) {
                const store = loadStore();
                store[uploadId] = { name: file.name, size: file.size, lastModified: file.lastModified || 0 };
                saveStore(store);
            }
            function clearSession(uploadId) {
                const store = loadStore();
                delete store[uploadId];
                saveStore(store);
            }
            function matchPending(file) {
                const store = loadStore();
                const lm = file.lastModified || 0;
                for (const id in store) {
                    const m = store[id];
                    if (m.name === file.name && m.size === file.size && m.lastModified === lm) return id;
                }
                return null;
            }

            function showToast(msg) {
                toastEl.innerText = msg;
                toastEl.style.opacity = '1';
                toastEl.style.transform = 'translate(-50%, 0)';
                clearTimeout(toastEl._timer);
                toastEl._timer = setTimeout(() => {
                    toastEl.style.opacity = '0';
                    toastEl.style.transform = 'translate(-50%, -16px)';
                }, 2200);
            }

            function formatSize(bytes) {
                if (bytes === 0) return '0 B';
                const units = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
            }

            function escapeHtml(s) {
                const d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }

            // 渲染文件列表
            function renderFiles() {
                fileItems.innerHTML = '';
                selectedFiles.forEach((it, idx) => {
                    const div = document.createElement('div');
                    div.className = 'file-item flex items-center justify-between gap-3';
                    const resumeTag = it.uploadId ? '<span class="resume-badge">续传中</span>' : '';
                    div.innerHTML = `
                        <span class="file-name text-[14px] lg:text-[16px] text-morandi-text truncate flex-1">${escapeHtml(it.file.name)}</span>
                        <span class="text-[11px] lg:text-[12px] text-morandi-subtext/60 flex-shrink-0">${formatSize(it.file.size)}</span>
                        ${resumeTag}
                        <button class="remove-btn" data-idx="${idx}"><i class="ph ph-x text-[15px] lg:text-[17px]"></i></button>
                    `;
                    fileItems.appendChild(div);
                });

                // 移除按钮
                fileItems.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.idx);
                        selectedFiles.splice(idx, 1);
                        renderFiles();
                        updateState();
                    });
                });

                const total = selectedFiles.reduce((s, it) => s + it.file.size, 0);
                fileCount.textContent = `已选择 ${selectedFiles.length} 个文件 (最多 ${MAX_FILES} 个)`;
                fileTotal.textContent = `总大小 ${formatSize(total)}`;

                if (selectedFiles.length === 0) {
                    fileList.style.display = 'none';
                    dropHint.style.display = 'flex';
                } else {
                    fileList.style.display = 'flex';
                    dropHint.style.display = 'none';
                }
            }

            function updateState() {
                if (selectedFiles.length === 0) {
                    btnAction.classList.remove('state-ready');
                    btnAction.classList.add('state-idle');
                    btnLabel.textContent = '请先选择文件';
                } else {
                    btnAction.classList.remove('state-idle');
                    btnAction.classList.add('state-ready');
                    btnLabel.textContent = '上传并生成邀请码';
                }
            }

            // 添加文件（带校验 + 断点匹配）
            function addFiles(fileListArr) {
                for (const f of fileListArr) {
                    if (selectedFiles.length >= MAX_FILES) {
                        showToast(`最多选择 ${MAX_FILES} 个文件`);
                        break;
                    }
                    if (f.size > MAX_SIZE) {
                        showToast(`「${f.name}」超过单文件 500MB 上限`);
                        continue;
                    }
                    const item = { file: f, uploadId: null };
                    const pid = matchPending(f);
                    if (pid) {
                        item.uploadId = pid;
                        showToast(`「${f.name}」检测到未完成上传，将自动续传`);
                    }
                    selectedFiles.push(item);
                }
                renderFiles();
                updateState();
            }

            // 点击上传区 -> 打开文件选择
            dropZone.addEventListener('click', function(e) {
                if (e.target.closest('.remove-btn')) return;
                if (uploading) return; // 上传中禁止
                fileInput.click();
            });

            fileInput.addEventListener('change', function() {
                addFiles(Array.from(this.files));
                this.value = '';
            });

            // 拖拽
            ['dragenter', 'dragover'].forEach(ev => {
                dropZone.addEventListener(ev, function(e) {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                });
            });
            ['dragleave', 'drop'].forEach(ev => {
                dropZone.addEventListener(ev, function(e) {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');
                });
            });
            dropZone.addEventListener('drop', function(e) {
                if (uploading) return;
                addFiles(Array.from(e.dataTransfer.files));
            });

            // 有效期选择
            expiryOptions.querySelectorAll('.expiry-pill').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (uploading) return;
                    selectedExpiry = parseInt(this.dataset.hours);
                    expiryOptions.querySelectorAll('.expiry-pill').forEach(b => b.classList.toggle('active', b === this));
                });
            });

            // 一键复制邀请码（避免手动框选复制出错）
            async function copyCode() {
                if (!lastCode) return;
                let ok = false;
                try {
                    await navigator.clipboard.writeText(lastCode);
                    ok = true;
                } catch (e) { ok = false; }
                if (!ok) {
                    const ta = document.createElement('textarea');
                    ta.value = lastCode;
                    ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); ok = true; } catch (e) {}
                    document.body.removeChild(ta);
                }
                showToast(ok ? '✅ 邀请码已复制: ' + lastCode : '复制失败，请手动复制');
            }
            btnCopy.addEventListener('click', copyCode);
            inviteArea.addEventListener('click', function() {
                if (lastCode) copyCode();
            });

            // 返回
            btnBack.addEventListener('click', function() {
                window.location.href = '/';
            });

            // 上传并生成邀请码
            btnAction.addEventListener('click', function() {
                if (uploading) return;
                if (!this.classList.contains('state-ready')) return;
                if (selectedFiles.length === 0) return;
                upload();
            });

            // ---------- 分片上传核心 ----------
            async function toError(res) {
                let msg = '请求失败';
                try { const j = await res.json(); msg = j.error || msg; } catch (e) {}
                return new Error(msg);
            }
            function apiJSON(url, opts) {
                return fetch(url, opts).then(res => {
                    if (!res.ok) return toError(res).then(e => { throw e; });
                    return res.json();
                });
            }
            function uploadChunk(uploadId, index, blob) {
                return new Promise((resolve, reject) => {
                    const fd = new FormData();
                    fd.append('chunk', blob, 'blob');
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', `/api/upload/${uploadId}/chunk?index=${index}`);
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(new Error('响应解析失败')); }
                        } else {
                            let msg = '上传失败';
                            try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
                            reject(new Error(msg));
                        }
                    };
                    xhr.onerror = function() { reject(new Error('网络错误')); };
                    xhr.send(fd);
                });
            }
            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            function updateProgress(uploaded, total) {
                const pct = total > 0 ? Math.min(100, Math.round((uploaded / total) * 100)) : 0;
                progressFill.style.width = pct + '%';
                progressText.textContent = pct + '%';
            }

            async function upload() {
                uploading = true;
                btnAction.classList.remove('state-ready');
                btnAction.classList.add('state-uploading');
                btnLabel.textContent = '上传中...';
                btnAction.querySelector('i').className = 'ph ph-circle-notch spin text-[20px] lg:text-[24px]';
                codeHint.textContent = '正在上传文件，请稍候...';
                progressWrap.style.display = 'flex';

                const totalBytes = selectedFiles.reduce((s, it) => s + it.file.size, 0);
                let uploadedBytes = 0;
                const uploadIds = [];

                try {
                    // 1) 初始化（或复用断点会话）
                    const sessions = [];
                    for (const item of selectedFiles) {
                        if (item.uploadId) {
                            sessions.push({ item, id: item.uploadId });
                            continue;
                        }
                        const data = await apiJSON('/api/upload/init', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: item.file.name, size: item.file.size })
                        });
                        item.uploadId = data.id;
                        saveSession(data.id, item.file);
                        sessions.push({ item, id: data.id });
                    }

                    // 2) 逐文件上传分片（含自动重试与断点续传）
                    for (const { item, id } of sessions) {
                        const st = await apiJSON('/api/upload/' + id + '/status');
                        const chunkSize = st.chunkSize;
                        let idx = Math.floor(st.received / chunkSize);
                        for (; idx < st.chunkCount; idx++) {
                            const start = idx * chunkSize;
                            const end = Math.min(item.file.size, start + chunkSize);
                            const blob = item.file.slice(start, end);
                            let ok = false;
                            for (let attempt = 0; attempt < 3 && !ok; attempt++) {
                                try {
                                    await uploadChunk(id, idx, blob);
                                    ok = true;
                                } catch (e) {
                                    if (attempt === 2) throw e;
                                    await sleep(400 * (attempt + 1));
                                }
                            }
                            uploadedBytes += (end - start);
                            updateProgress(uploadedBytes, totalBytes);
                        }
                        uploadIds.push(id);
                    }

                    // 3) 合并生成邀请码
                    const data = await apiJSON('/api/upload/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ uploadIds: uploadIds, expireHours: selectedExpiry })
                    });
                    uploadIds.forEach(clearSession);
                    selectedFiles.forEach(it => { it.uploadId = null; });
                    onUploadSuccess(data);
                } catch (e) {
                    onUploadError(e.message || '上传失败');
                } finally {
                    uploading = false;
                }
            }

            function onUploadSuccess(res) {
                progressFill.style.width = '100%';
                progressText.textContent = '100%';

                btnAction.classList.remove('state-uploading');
                btnAction.classList.add('state-idle');
                btnLabel.textContent = '已上传完成';
                btnAction.querySelector('i').className = 'ph ph-check-circle text-[20px] lg:text-[24px]';
                codeHint.textContent = '分享给他人，' + selectedExpiry + ' 小时内有效';

                // 填充邀请码
                const code = res.code;
                lastCode = code;
                inviteArea.innerHTML = '';
                for (let i = 0; i < 6; i++) {
                    if (i === 3) {
                        const sp = document.createElement('span');
                        sp.className = 'text-morandi-subtext/30 text-[20px] lg:text-[26px] font-light select-none mx-0.5';
                        sp.textContent = ' ';
                        inviteArea.appendChild(sp);
                    }
                    const box = document.createElement('div');
                    box.className = 'code-box filled';
                    box.textContent = code[i];
                    inviteArea.appendChild(box);
                }
                // 显示一键复制按钮
                btnCopy.classList.remove('hidden');
                btnCopy.classList.add('flex');
                showToast('分享已就绪，邀请码: ' + code.slice(0,3) + ' ' + code.slice(3));
            }

            function onUploadError(msg) {
                btnAction.classList.remove('state-uploading');
                btnAction.classList.add('state-ready');
                btnLabel.textContent = '继续上传（断点续传）';
                btnAction.querySelector('i').className = 'ph ph-check-circle text-[20px] lg:text-[24px]';
                codeHint.textContent = '上传中断，可重新点击继续 · 已上传部分自动续传';
                btnCopy.classList.add('hidden');
                btnCopy.classList.remove('flex');
                showToast('⚠️ ' + msg);
            }

            // 初始状态
            fileList.style.display = 'none';
            dropHint.style.display = 'flex';
            progressWrap.style.display = 'none';

            // 检测是否有未完成的断点会话
            const pendingCount = Object.keys(loadStore()).length;
            if (pendingCount > 0) {
                setTimeout(() => showToast('检测到 ' + pendingCount + ' 个未完成上传，重新选择相同文件即可续传'), 600);
            }

            console.log('📤 上传页面已加载 (分片上传 + 断点续传)');
        });
    </script>
</body>
